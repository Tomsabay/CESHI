<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c23152"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)" rx="12"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="600" height="50" fill="#0d1117" rx="12"/>
  <rect x="0" y="38" width="600" height="12" fill="#0d1117"/>
  <circle cx="24" cy="25" r="7" fill="#ff5f57"/>
  <circle cx="46" cy="25" r="7" fill="#ffbd2e"/>
  <circle cx="68" cy="25" r="7" fill="#28ca41"/>
  <text x="300" y="31" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">Claude Code — /home/user/CESHI</text>

  <!-- Left sidebar -->
  <rect x="0" y="50" width="50" height="350" fill="#161b22"/>
  <rect x="10" y="70" width="30" height="30" rx="6" fill="#21262d"/>
  <text x="25" y="91" font-family="monospace" font-size="16" fill="#58a6ff" text-anchor="middle">≡</text>
  <rect x="10" y="115" width="30" height="30" rx="6" fill="#21262d"/>
  <text x="25" y="136" font-family="monospace" font-size="14" fill="#8b949e" text-anchor="middle">⚙</text>

  <!-- Main content area -->
  <rect x="50" y="50" width="550" height="350" fill="#0d1117"/>

  <!-- Chat messages -->
  <!-- User message -->
  <rect x="320" y="80" width="220" height="50" rx="10" fill="#1f6feb"/>
  <text x="335" y="100" font-family="monospace" font-size="11" fill="white">给我做个SVG预览</text>
  <text x="335" y="118" font-family="monospace" font-size="11" fill="white">我想看看效果</text>
  <circle cx="555" cy="95" r="12" fill="#388bfd"/>
  <text x="555" y="99" font-family="monospace" font-size="10" fill="white" text-anchor="middle">U</text>

  <!-- Claude message -->
  <rect x="60" y="150" width="280" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="78" cy="168" r="12" fill="#e94560"/>
  <text x="78" y="172" font-family="monospace" font-size="9" fill="white" text-anchor="middle">CC</text>
  <text x="98" y="172" font-family="monospace" font-size="11" fill="#c9d1d9" font-weight="bold">Claude Code</text>
  <text x="70" y="195" font-family="monospace" font-size="11" fill="#8b949e">好的！正在生成SVG...</text>
  <text x="70" y="213" font-family="monospace" font-size="11" fill="#8b949e">文件已保存到 preview.svg</text>

  <!-- Code block -->
  <rect x="60" y="245" width="460" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="60" y="245" width="460" height="22" rx="8" fill="#21262d"/>
  <rect x="60" y="256" width="460" height="11" fill="#21262d"/>
  <text x="75" y="260" font-family="monospace" font-size="10" fill="#8b949e">preview.svg</text>
