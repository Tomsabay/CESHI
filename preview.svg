  <text x="105" y="278" font-family="monospace" font-size="10" fill="#e3b341"> xmlns=</text>
  <text x="160" y="278" font-family="monospace" font-size="10" fill="#a5d6ff">"http://www.w3.org/2000/svg"</text>
  <text x="75" y="293" font-family="monospace" font-size="10" fill="#8b949e">  width="600" height="400"...</text>
  <text x="75" y="308" font-family="monospace" font-size="10" fill="#79c0ff">&lt;/svg&gt;</text>

  <!-- Input bar -->
  <rect x="50" y="358" width="550" height="42" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="60" y="366" width="420" height="26" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="75" y="383" font-family="monospace" font-size="11" fill="#484f58">输入消息...</text>
  <rect x="492" y="366" width="50" height="26" rx="6" fill="url(#btn)"/>
